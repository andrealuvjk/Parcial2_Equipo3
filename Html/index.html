<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Biblioteca Universitaria</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Biblioteca Universitaria</h1>

    <h2>Catálogo de materiales</h2>

    <div class="catalogo">

        <div class="material">
            <h3>El Principito</h3>
            <p>Tipo: Libro</p>
            <p>Disponible: Sí</p>
            <button onclick="prestar('El Principito')">
                Solicitar préstamo
            </button>
        </div>

        <div class="material">
            <h3>Harry Potter</h3>
            <p>Tipo: Libro</p>
            <p>Disponible: Sí</p>
            <button onclick="prestar('Harry Potter')">
                Solicitar préstamo
            </button>
        </div>

        <div class="material">
            <h3>National Geographic</h3>
            <p>Tipo: Revista</p>
            <p>Disponible: Sí</p>
            <button onclick="prestar('National Geographic')">
                Solicitar préstamo
            </button>
        </div>

        <div class="material">
            <h3>Ciencia Hoy</h3>
            <p>Tipo: Revista</p>
            <p>Disponible: No</p>
            <button onclick="prestar('Ciencia Hoy')">
                Solicitar préstamo
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
